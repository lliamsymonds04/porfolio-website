<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Lliam Symonds | Software Engineer</title>
    <meta
      name="description"
      content="Lliam Symonds is a software engineer in Brisbane. He works on AI claims automation at Suncorp and builds fullstack, machine learning and infra projects on the side."
    />

    <!-- theme-color matches the token layer's two palettes -->
    <meta name="theme-color" content="#060908" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7faf8" media="(prefers-color-scheme: light)" />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- Open Graph: absolute URLs; crawlers don't resolve relative ones (§8.4) -->
    <meta property="og:type" content="website" />
    <link rel="canonical" href="https://llia.me/" />
    <meta property="og:url" content="https://llia.me/" />
    <meta property="og:title" content="Lliam Symonds | Software Engineer" />
    <meta
      property="og:description"
      content="Software engineer at Suncorp working on AI claims automation. Fullstack, machine learning and infra projects. Brisbane, Australia."
    />
    <meta property="og:image" content="https://llia.me/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Lliam Symonds, Software Engineer, site preview" />
    <meta property="og:locale" content="en_AU" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lliam Symonds | Software Engineer" />
    <meta
      name="twitter:description"
      content="Software engineer at Suncorp working on AI claims automation. Fullstack, machine learning and infra projects. Brisbane, Australia."
    />
    <meta name="twitter:image" content="https://llia.me/og.png" />

    <!-- Person JSON-LD (§8.4: cheap and worth it; JobPosting-adjacent is overkill) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Lliam Symonds",
        "jobTitle": "Software Engineer",
        "worksFor": { "@type": "Organization", "name": "Suncorp" },
        "email": "mailto:lliamsymonds04@gmail.com",
        "url": "https://llia.me/",
        "sameAs": [
          "https://github.com/lliamsymonds04",
          "https://www.linkedin.com/in/lliam-symonds/",
          "https://www.instagram.com/lliamsymonds04/"
        ],
        "alumniOf": {
          "@type": "CollegeOrUniversity",
          "name": "University of Queensland"
        },
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Brisbane",
          "addressCountry": "AU"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
